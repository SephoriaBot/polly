<svg xmlns="http://www.w3.org/2000/svg"
     width="100"
     height="100"
     viewBox="0 0 100 100"
     fill="none">

  <!-- =====================================================
       PASTEL GOTH — DARK MODE
       ORNATE VICTORIAN CARD BORDER

       Corner filigree uses thinner strokes + a picot dot
       trail (instead of one solid diamond) so it reads as
       delicate lace beading rather than a thick vine curl.
       ===================================================== -->

  <!-- MAIN BORDER -->
  <rect
    x="7"
    y="7"
    width="86"
    height="86"
    rx="7"
    stroke="#C7A8CF"
    stroke-width="2.2"
  />

  <!-- INNER HAIRLINE -->
  <rect
    x="11"
    y="11"
    width="78"
    height="78"
    rx="4"
    stroke="#8E7197"
    stroke-width="1"
    stroke-dasharray="1.5 4"
  />

  <!-- =====================================================
       TOP LEFT ORNAMENT
       ===================================================== -->

  <path
    d="
      M28 7
      C22 7 18 8 15 11
      C12 14 10 18 10 24
    "
    stroke="#C7A8CF"
    stroke-width="1.6"
    stroke-linecap="round"
  />
  <path
    d="M17 17 C20 14 24 13 28 13"
    stroke="#C7A8CF"
    stroke-width="1.3"
    stroke-linecap="round"
  />
  <path
    d="M14 22 C17 19 20 18 23 18"
    stroke="#C7A8CF"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <circle cx="14.5" cy="14.5" r="1.7" fill="#8E7197" />
  <circle cx="11" cy="19" r="1.1" fill="#8E7197" />
  <circle cx="9.3" cy="24" r="0.75" fill="#8E7197" />


  <!-- =====================================================
       TOP RIGHT ORNAMENT
       ===================================================== -->

  <path
    d="
      M72 7
      C78 7 82 8 85 11
      C88 14 90 18 90 24
    "
    stroke="#C7A8CF"
    stroke-width="1.6"
    stroke-linecap="round"
  />
  <path
    d="M83 17 C80 14 76 13 72 13"
    stroke="#C7A8CF"
    stroke-width="1.3"
    stroke-linecap="round"
  />
  <path
    d="M86 22 C83 19 80 18 77 18"
    stroke="#C7A8CF"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <circle cx="85.5" cy="14.5" r="1.7" fill="#8E7197" />
  <circle cx="89" cy="19" r="1.1" fill="#8E7197" />
  <circle cx="90.7" cy="24" r="0.75" fill="#8E7197" />


  <!-- =====================================================
       BOTTOM LEFT ORNAMENT
       ===================================================== -->

  <path
    d="
      M10 76
      C10 82 12 86 15 89
      C18 92 22 93 28 93
    "
    stroke="#C7A8CF"
    stroke-width="1.6"
    stroke-linecap="round"
  />
  <path
    d="M17 83 C20 86 24 87 28 87"
    stroke="#C7A8CF"
    stroke-width="1.3"
    stroke-linecap="round"
  />
  <path
    d="M14 78 C17 81 20 82 23 82"
    stroke="#C7A8CF"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <circle cx="14.5" cy="85.5" r="1.7" fill="#8E7197" />
  <circle cx="11" cy="81" r="1.1" fill="#8E7197" />
  <circle cx="9.3" cy="76" r="0.75" fill="#8E7197" />


  <!-- =====================================================
       BOTTOM RIGHT ORNAMENT
       ===================================================== -->

  <path
    d="
      M90 76
      C90 82 88 86 85 89
      C82 92 78 93 72 93
    "
    stroke="#C7A8CF"
    stroke-width="1.6"
    stroke-linecap="round"
  />
  <path
    d="M83 83 C80 86 76 87 72 87"
    stroke="#C7A8CF"
    stroke-width="1.3"
    stroke-linecap="round"
  />
  <path
    d="M86 78 C83 81 80 82 77 82"
    stroke="#C7A8CF"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <circle cx="85.5" cy="85.5" r="1.7" fill="#8E7197" />
  <circle cx="89" cy="81" r="1.1" fill="#8E7197" />
  <circle cx="90.7" cy="76" r="0.75" fill="#8E7197" />

</svg>
