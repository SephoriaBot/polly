<svg xmlns="http://www.w3.org/2000/svg"
     width="100"
     height="100"
     viewBox="0 0 100 100"
     fill="none">

  <!-- =====================================================
       PASTEL GOTH — ORNATE VICTORIAN CARD BORDER

       Designed as a 9-slice border.
       Soft gothic plum + lavender accent.
       Center remains transparent.
       ===================================================== -->

  <!-- MAIN BORDER -->
  <rect
    x="7"
    y="7"
    width="86"
    height="86"
    rx="7"
    stroke="#6D506F"
    stroke-width="3"
  />

  <!-- INNER HAIRLINE -->
  <rect
    x="11"
    y="11"
    width="78"
    height="78"
    rx="4"
    stroke="#B99AC0"
    stroke-width="1.5"
    stroke-dasharray="2 4"
  />

  <!-- =====================================================
       TOP LEFT ORNAMENT
       ===================================================== -->

  <path
    d="
      M28 7
      C22 7 18 8 15 11
      C12 14 10 18 10 24

      M17 17
      C20 14 24 13 28 13

      M14 22
      C17 19 20 18 23 18
    "
    stroke="#6D506F"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- tiny diamond -->
  <path
    d="M15 13 L18 16 L15 19 L12 16 Z"
    fill="#B99AC0"
  />


  <!-- =====================================================
       TOP RIGHT ORNAMENT
       ===================================================== -->

  <path
    d="
      M72 7
      C78 7 82 8 85 11
      C88 14 90 18 90 24

      M83 17
      C80 14 76 13 72 13

      M86 22
      C83 19 80 18 77 18
    "
    stroke="#6D506F"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <path
    d="M85 13 L88 16 L85 19 L82 16 Z"
    fill="#B99AC0"
  />


  <!-- =====================================================
       BOTTOM LEFT ORNAMENT
       ===================================================== -->

  <path
    d="
      M10 76
      C10 82 12 86 15 89
      C18 92 22 93 28 93

      M17 83
      C20 86 24 87 28 87

      M14 78
      C17 81 20 82 23 82
    "
    stroke="#6D506F"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <path
    d="M15 81 L18 84 L15 87 L12 84 Z"
    fill="#B99AC0"
  />


  <!-- =====================================================
       BOTTOM RIGHT ORNAMENT
       ===================================================== -->

  <path
    d="
      M90 76
      C90 82 88 86 85 89
      C82 92 78 93 72 93

      M83 83
      C80 86 76 87 72 87

      M86 78
      C83 81 80 82 77 82
    "
    stroke="#6D506F"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <path
    d="M85 81 L88 84 L85 87 L82 84 Z"
    fill="#B99AC0"
  />

</svg>