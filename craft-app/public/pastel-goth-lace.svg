<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 300"
  preserveAspectRatio="none"
>
  <defs>
    <pattern
      id="laceTop"
      width="20"
      height="10"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M0 0
           C0 5 2.5 9 5 9
           C7.5 9 10 5 10 0
           C10 5 12.5 9 15 9
           C17.5 9 20 5 20 0
           L20 0
           L0 0 Z"
        fill="white"
      />
    </pattern>

    <pattern
      id="laceSide"
      width="10"
      height="20"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M0 0
           C5 0 9 2.5 9 5
           C9 7.5 5 10 0 10
           C5 10 9 12.5 9 15
           C9 17.5 5 20 0 20
           Z"
        fill="white"
      />
    </pattern>
  </defs>

  <!-- TOP -->
  <rect
    x="0"
    y="0"
    width="400"
    height="10"
    fill="url(#laceTop)"
  />

  <!-- BOTTOM -->
  <rect
    x="0"
    y="290"
    width="400"
    height="10"
    fill="url(#laceTop)"
    transform="rotate(180 200 295)"
  />

  <!-- LEFT -->
  <rect
    x="0"
    y="0"
    width="10"
    height="300"
    fill="url(#laceSide)"
  />

  <!-- RIGHT -->
  <rect
    x="390"
    y="0"
    width="10"
    height="300"
    fill="url(#laceSide)"
    transform="rotate(180 395 150)"
  />
</svg>