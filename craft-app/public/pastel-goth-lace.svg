<svg xmlns="http://www.w3.org/2000/svg"
     width="60"
     height="60"
     viewBox="0 0 60 60"
     fill="none">

  <!-- =====================================================
       9-SLICE LACE BORDER
       Broader, softer waves
       White lace with pastel-gold outline
       ===================================================== -->

  <!-- PASTEL GOLD OUTLINE -->
  <g stroke="#D8C28A"
     stroke-width="7"
     stroke-linecap="round"
     fill="none">

    <!-- TOP EDGE -->
    <path d="
      M20 6
      C24 0 28 0 32 6
      C36 12 40 12 44 6
      C48 0 52 0 56 6
    " />

    <!-- BOTTOM EDGE -->
    <path d="
      M20 54
      C24 60 28 60 32 54
      C36 48 40 48 44 54
      C48 60 52 60 56 54
    " />

    <!-- LEFT EDGE -->
    <path d="
      M6 20
      C0 24 0 28 6 32
      C12 36 12 40 6 44
      C0 48 0 52 6 56
    " />

    <!-- RIGHT EDGE -->
    <path d="
      M54 20
      C60 24 60 28 54 32
      C48 36 48 40 54 44
      C60 48 60 52 54 56
    " />

    <!-- TOP-LEFT CORNER -->
    <path d="
      M20 3
      H14
      C7.9 3 3 7.9 3 14
      V20
    " />

    <!-- TOP-RIGHT CORNER -->
    <path d="
      M40 3
      H46
      C52.1 3 57 7.9 57 14
      V20
    " />

    <!-- BOTTOM-LEFT CORNER -->
    <path d="
      M3 40
      V46
      C3 52.1 7.9 57 14 57
      H20
    " />

    <!-- BOTTOM-RIGHT CORNER -->
    <path d="
      M57 40
      V46
      C57 52.1 52.1 57 46 57
      H40
    " />

  </g>


  <!-- ORIGINAL WHITE LACE -->
  <g stroke="#FFFFFF"
     stroke-width="5"
     stroke-linecap="round"
     fill="none">

    <!-- TOP EDGE -->
    <path d="
      M20 6
      C24 0 28 0 32 6
      C36 12 40 12 44 6
      C48 0 52 0 56 6
    " />

    <!-- BOTTOM EDGE -->
    <path d="
      M20 54
      C24 60 28 60 32 54
      C36 48 40 48 44 54
      C48 60 52 60 56 54
    " />

    <!-- LEFT EDGE -->
    <path d="
      M6 20
      C0 24 0 28 6 32
      C12 36 12 40 6 44
      C0 48 0 52 6 56
    " />

    <!-- RIGHT EDGE -->
    <path d="
      M54 20
      C60 24 60 28 54 32
      C48 36 48 40 54 44
      C60 48 60 52 54 56
    " />

    <!-- TOP-LEFT CORNER -->
    <path d="
      M20 3
      H14
      C7.9 3 3 7.9 3 14
      V20
    " />

    <!-- TOP-RIGHT CORNER -->
    <path d="
      M40 3
      H46
      C52.1 3 57 7.9 57 14
      V20
    " />

    <!-- BOTTOM-LEFT CORNER -->
    <path d="
      M3 40
      V46
      C3 52.1 7.9 57 14 57
      H20
    " />

    <!-- BOTTOM-RIGHT CORNER -->
    <path d="
      M57 40
      V46
      C57 52.1 52.1 57 46 57
      H40
    " />

  </g>

</svg>