    stroke-linecap="round"
    fill="none"
  />


  <!-- BOTTOM EDGE -->
  <path
    d="
      M20 54
      C22 58 26 58 28 54
      C30 50 34 50 36 54
      C38 58 42 58 44 54
      C46 50 50 50 52 54
    "
