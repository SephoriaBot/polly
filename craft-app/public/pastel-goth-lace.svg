<svg xmlns="http://www.w3.org/2000/svg"
     width="60"
     height="60"
     viewBox="0 0 60 60"
     fill="none">

  <!-- =====================================================
       9-SLICE LACE BORDER — pastel goth (light)
       Plum outline (--accent) with dusty pink petal (--pink)
       and picot beads at each scallop tip
       ===================================================== -->

  <!-- PLUM OUTLINE -->
  <g stroke="#4A2E44"
     stroke-width="6"
     stroke-linecap="round"
     fill="none">

    <!-- TOP -->
    <path d="
      M20 6
      C22 2 26 2 28 6
      C30 10 34 10 36 6
      C38 2 42 2 44 6
      C46 10 50 10 52 6
    " />

    <!-- BOTTOM -->
    <path d="
      M20 54
      C22 58 26 58 28 54
      C30 50 34 50 36 54
      C38 58 42 58 44 54
      C46 50 50 50 52 54
    " />

    <!-- LEFT -->
    <path d="
      M6 20
      C2 22 2 26 6 28
      C10 30 10 34 6 36
      C2 38 2 42 6 44
      C10 46 10 50 6 52
    " />

    <!-- RIGHT -->
    <path d="
      M54 20
      C58 22 58 26 54 28
      C50 30 50 34 54 36
      C58 38 58 42 54 44
      C50 46 50 50 54 52
    " />

    <!-- CORNERS -->
    <path d="M20 3 H14 C7.9 3 3 7.9 3 14 V20" />
    <path d="M40 3 H46 C52.1 3 57 7.9 57 14 V20" />
    <path d="M3 40 V46 C3 52.1 7.9 57 14 57 H20" />
    <path d="M57 40 V46 C57 52.1 52.1 57 46 57 H40" />

  </g>


  <!-- DUSTY PINK PETAL -->
  <g stroke="#D9A0C2"
     stroke-width="4"
     stroke-linecap="round"
     fill="none">

    <!-- TOP -->
    <path d="
      M20 6
      C22 2 26 2 28 6
      C30 10 34 10 36 6
      C38 2 42 2 44 6
      C46 10 50 10 52 6
    " />

    <!-- BOTTOM -->
    <path d="
      M20 54
      C22 58 26 58 28 54
      C30 50 34 50 36 54
      C38 58 42 58 44 54
      C46 50 50 50 52 54
    " />

    <!-- LEFT -->
    <path d="
      M6 20
      C2 22 2 26 6 28
      C10 30 10 34 6 36
      C2 38 2 42 6 44
      C10 46 10 50 6 52
    " />

    <!-- RIGHT -->
    <path d="
      M54 20
      C58 22 58 26 54 28
      C50 30 50 34 54 36
      C58 38 58 42 54 44
      C50 46 50 50 54 52
    " />

    <!-- CORNERS -->
    <path d="M20 3 H14 C7.9 3 3 7.9 3 14 V20" />
    <path d="M40 3 H46 C52.1 3 57 7.9 57 14 V20" />
    <path d="M3 40 V46 C3 52.1 7.9 57 14 57 H20" />
    <path d="M57 40 V46 C57 52.1 52.1 57 46 57 H40" />

  </g>

  <!-- PICOT BEADS at scallop tips -->
  <g fill="#4A2E44">
    <circle cx="28" cy="4" r="1.6" />
    <circle cx="44" cy="4" r="1.6" />
    <circle cx="28" cy="56" r="1.6" />
    <circle cx="44" cy="56" r="1.6" />
    <circle cx="4" cy="28" r="1.6" />
    <circle cx="4" cy="44" r="1.6" />
    <circle cx="56" cy="28" r="1.6" />
    <circle cx="56" cy="44" r="1.6" />
  </g>

</svg>
