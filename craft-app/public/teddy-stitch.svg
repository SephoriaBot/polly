<svg xmlns="http://www.w3.org/2000/svg"
     width="100"
     height="100"
     viewBox="0 0 100 100"
     fill="none">

  <!-- Outer sewn seam -->
  <rect
    x="6"
    y="6"
    width="88"
    height="88"
    rx="12"
    stroke="#B8875A"
    stroke-width="5"
    stroke-dasharray="2 7"
    stroke-linecap="round"
  />

  <!-- Soft inner seam -->
  <rect
    x="12"
    y="12"
    width="76"
    height="76"
    rx="8"
    stroke="#D8B58A"
    stroke-width="2"
    stroke-dasharray="1 5"
    stroke-linecap="round"
  />

</svg>