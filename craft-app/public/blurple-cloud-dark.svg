<svg xmlns="http://www.w3.org/2000/svg"
     width="60"
     height="60"
     viewBox="0 0 60 60"
     fill="none">

  <!-- =====================================================
       SOFT CLOUD BORDER — blurple dark
       Larger, rounder cloud puffs with gentle spacing
       ===================================================== -->

  <!-- LAVENDER OUTLINE -->
  <g stroke="#D0BFE5"
     stroke-width="6"
     stroke-linecap="round"
     fill="none">

    <!-- TOP -->
    <path d="
      M20 6
      C23 1 28 1 31 6
      C34 11 39 11 42 6
      C45 1 50 1 53 6
    " />

    <!-- BOTTOM -->
    <path d="
      M20 54
      C23 59 28 59 31 54
      C34 49 39 49 42 54
      C45 59 50 59 53 54
    " />

    <!-- LEFT -->
    <path d="
      M6 20
      C1 23 1 28 6 31
      C11 34 11 39 6 42
      C1 45 1 50 6 53
    " />

    <!-- RIGHT -->
    <path d="
      M54 20
      C59 23 59 28 54 31
      C49 34 49 39 54 42
      C59 45 59 50 54 53
    " />

    <!-- CORNERS -->
    <path d="M20 3 H14 C7.9 3 3 7.9 3 14 V20" />
    <path d="M40 3 H46 C52.1 3 57 7.9 57 14 V20" />
    <path d="M3 40 V46 C3 52.1 7.9 57 14 57 H20" />
    <path d="M57 40 V46 C57 52.1 52.1 57 46 57 H40" />

  </g>


  <!-- MEDIUM BLUE INNER CLOUD -->
  <g stroke="#7898D1"
     stroke-width="3.5"
     stroke-linecap="round"
     fill="none">

    <!-- TOP -->
    <path d="
      M20 6
      C23 1 28 1 31 6
      C34 11 39 11 42 6
      C45 1 50 1 53 6
    " />

    <!-- BOTTOM -->
    <path d="
      M20 54
      C23 59 28 59 31 54
      C34 49 39 49 42 54
      C45 59 50 59 53 54
    " />

    <!-- LEFT -->
    <path d="
      M6 20
      C1 23 1 28 6 31
      C11 34 11 39 6 42
      C1 45 1 50 6 53
    " />

    <!-- RIGHT -->
    <path d="
      M54 20
      C59 23 59 28 54 31
      C49 34 49 39 54 42
      C59 45 59 50 54 53
    " />

    <!-- CORNERS -->
    <path d="M20 3 H14 C7.9 3 3 7.9 3 14 V20" />
    <path d="M40 3 H46 C52.1 3 57 7.9 57 14 V20" />
    <path d="M3 40 V46 C3 52.1 7.9 57 14 57 H20" />
    <path d="M57 40 V46 C57 52.1 52.1 57 46 57 H40" />

  </g>


  <!-- GOLD FLECKS -->
  <g fill="#D5B66D">
    <circle cx="31" cy="5" r="1.3" />
    <circle cx="42" cy="5" r="1.3" />

    <circle cx="31" cy="55" r="1.3" />
    <circle cx="42" cy="55" r="1.3" />

    <circle cx="5" cy="31" r="1.3" />
    <circle cx="5" cy="42" r="1.3" />

    <circle cx="55" cy="31" r="1.3" />
    <circle cx="55" cy="42" r="1.3" />
